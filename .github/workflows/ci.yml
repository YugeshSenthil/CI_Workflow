name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:   # Enables manual triggering

jobs:
  test-python:
    name: Lint & Test Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Lint with Flake8
        run: |
          # Fails if syntax errors or undefined names are present
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings check
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest
        run: pytest

  test-bash:
    name: Lint & Test Bash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck & BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: Lint with ShellCheck
        run: |
          sh_files=$(find . -type f -name "*.sh" -not -path "*/.*")
          if [ -n "$sh_files" ]; then
            echo "$sh_files" | xargs shellcheck
          else
            echo "No .sh scripts found."
          fi

      - name: Run BATS tests
        run: |
          if [ -d "tests" ] && ls tests/*.bats 1> /dev/null 2>&1; then
            bats tests/
          else
            echo "No .bats files found."
          fi
